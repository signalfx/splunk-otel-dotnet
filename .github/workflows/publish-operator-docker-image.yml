jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      major_version: ${{ steps.version.outputs.major_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get the latest release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
            RELEASE_VERSION="$(git describe --abbrev=0)"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_VERSION="$GITHUB_REF_NAME"
          else
            echo "This script can only be run on the tag or a release branch"
            exit 1
          fi

          MAJOR_VERSION="${GITHUB_REF_NAME%%.*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_version=${MAJOR_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
            archive_arch: x64
            arch: amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            archive_arch: arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    env:
      IMAGE: ghcr.io/signalfx/splunk-otel-dotnet/splunk-otel-dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            RELEASE_VER=${{ needs.prepare.outputs.release_version }}
            ARCHIVE_ARCH=${{ matrix.archive_arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/signalfx/splunk-otel-dotnet/splunk-otel-dotnet
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Publish multi-architecture image under existing tags
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          MAJOR_VERSION: ${{ needs.prepare.outputs.major_version }}
        shell: bash
        run: |
          set -euo pipefail
          digest_files=(/tmp/digests/*)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "Expected two image digests, found ${#digest_files[@]}"
            exit 1
          fi

          refs=()
          for digest_file in "${digest_files[@]}"; do
            refs+=("${IMAGE}@sha256:$(basename "$digest_file")")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${MAJOR_VERSION}" \
            --tag "${IMAGE}:${RELEASE_VERSION}" \
            "${refs[@]}"
