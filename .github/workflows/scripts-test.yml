name: scripts-test

on:
  release:
    types: [published]

jobs:
  powershell-script:
    runs-on: windows-2025
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
      - name: Test the PowerShell module instructions from README.md
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          mkdir testapp
          cd testapp
          dotnet new console
          dotnet publish -f net10.0 -c Release
          $module_url = "https://github.com/$env:GITHUB_REPOSITORY_NAME/releases/download/$env:RELEASE_TAG_NAME/Splunk.OTel.DotNet.psm1"
          $dl_path = Join-Path $env:temp "Splunk.OTel.DotNet.psm1"
          $log_path = "C:\ProgramData\OpenTelemetry .NET AutoInstrumentation\logs\*"
          Invoke-WebRequest -Uri $module_url -OutFile $dl_path
          gh release verify-asset $env:RELEASE_TAG_NAME $dl_path --repo $env:GITHUB_REPOSITORY_NAME
          if ($LASTEXITCODE -ne 0) { throw "GitHub release verification failed for the PowerShell module." }
          gh attestation verify $dl_path `
            --repo $env:GITHUB_REPOSITORY_NAME `
            --signer-workflow "$env:GITHUB_REPOSITORY_NAME/.github/workflows/ci.yml" `
            --source-ref "refs/tags/$env:RELEASE_TAG_NAME"
          if ($LASTEXITCODE -ne 0) { throw "GitHub artifact attestation verification failed for the PowerShell module." }
          Import-Module $dl_path
          Install-OpenTelemetryCore -ErrorAction Stop
          $install_dir = Get-OpenTelemetryInstallDirectory
          Register-OpenTelemetryForCurrentSession -OTelServiceName "MyServiceDisplayName"
          ./bin/Release/net10.0/publish/testapp
          if (-not $?) { throw "dotnet help returned exit code: $LASTEXITCODE" }
          if (-not (Test-Path $log_path)) { throw "Log file does not exist. Instrumentation test failed." }
          Remove-Item $log_path
          Unregister-OpenTelemetryForCurrentSession
          ./bin/Release/net10.0/publish/testapp
          if (-not $?) { throw "dotnet help returned exit code: $LASTEXITCODE" }
          if (Test-Path $log_path) { throw "Log file exists. Instrumentation unregister failed." }
          Uninstall-OpenTelemetryCore
          if (Test-Path $install_dir) { throw "Core files exist. Core uninstall failed." }

  shell-scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: windows-2022
            log-dir: "/c/ProgramData/OpenTelemetry .NET AutoInstrumentation/logs"
          - machine: ubuntu-22.04
            log-dir: "/var/log/opentelemetry/dotnet"
          - machine: macos-14
            log-dir: "/var/log/opentelemetry/dotnet"
    runs-on: ${{ matrix.machine }}
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
      - run: brew install coreutils
        if: ${{ runner.os == 'macOS' }}
      - name: Create test directory
        env:
          LOG_DIR: ${{ matrix.log-dir }}
        run: |
          sudo mkdir -p "$LOG_DIR"
          sudo chown "$(id -u):$(id -g)" "$LOG_DIR"
          chmod 0700 "$LOG_DIR"
        if: ${{ runner.os != 'Windows' }}
      - name: Test the Shell scripts from README.md
        shell: bash
        run: |
          mkdir testapp
          cd testapp
          dotnet new console
          dotnet publish -f net10.0 -c Release
          set -e
          curl -sSfL https://github.com/signalfx/splunk-otel-dotnet/releases/download/${{ github.event.release.tag_name }}/splunk-otel-dotnet-install.sh -O
          sh ./splunk-otel-dotnet-install.sh
            test "$(ls -A "$HOME/.splunk-otel-dotnet")"
          curl -sSfL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/instrument.sh -O
          . ./instrument.sh
          ./bin/Release/net10.0/publish/testapp
            test "$(ls -A '${{ matrix.log-dir }}' )"

  shell-scripts-container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: ubuntu-22.04
            base-image: alpine-x64
          - machine: ubuntu-22.04-arm
            base-image: alpine-arm64
    runs-on: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the Shell scripts from README.md in Docker container
        run: |
          set -e
          docker build -t mybuildimage -f "./docker/${{ matrix.base-image }}.dockerfile" .
          docker run --mount type=bind,source="${GITHUB_WORKSPACE}",target=/project --rm mybuildimage /bin/sh -c '
            set -e
            mkdir testapp
            cd testapp
            dotnet new console
            dotnet publish /p:TreatWarningsAsErrors=false -f net10.0 -c Release
            curl -sSfL https://github.com/signalfx/splunk-otel-dotnet/releases/download/${{ github.event.release.tag_name }}/splunk-otel-dotnet-install.sh -O
            sh ./splunk-otel-dotnet-install.sh
              test "$(ls -A "$HOME/.splunk-otel-dotnet")"
            curl -sSfL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/instrument.sh -O
            . ./instrument.sh
            ./bin/Release/net10.0/publish/testapp
              test "$(ls -A /var/log/opentelemetry/dotnet )"
          '
