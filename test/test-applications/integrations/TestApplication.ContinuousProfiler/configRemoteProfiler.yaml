file_format: "1.0-rc.1"

plugins/development:
  plugins:
    - Splunk.OpenTelemetry.AutoInstrumentation.Plugin, Splunk.OpenTelemetry.AutoInstrumentation

opamp/development:
  server_url: ${OTEL_DOTNET_AUTO_OPAMP_SERVER_URL}
  features:
    remote_config:

tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_http:

instrumentation/development:
  dotnet:
    traces:
      additional_sources:
        - "TestApplication.ContinuousProfiler"

distribution:
  splunk:
    profiling:
      exporter:
        otlp_log_http:
          endpoint: ${SPLUNK_PROFILER_LOGS_ENDPOINT}
          schedule_delay: 1000
      always_on:
        cpu_profiler:
          sampling_interval: 1234
